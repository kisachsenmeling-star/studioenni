<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ENNI – keramikk</title>
<meta name="description" content="ENNI – håndlaget keramikk. Ny nettside kommer snart.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--sand:#b39c86;--sand-mork:#9c8571;--oker:#f3b843;--krem:#fbf6f0;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--sand);color:var(--krem);font-family:Poppins,system-ui,sans-serif;font-weight:300;-webkit-font-smoothing:antialiased}
  .side{min-height:100vh;display:grid;grid-template-columns:1fr 1fr;}
  .tekst{display:flex;flex-direction:column;justify-content:center;padding:64px clamp(24px,7vw,110px);gap:40px}
  .logo{font-weight:400;color:var(--oker);font-size:clamp(64px,10vw,150px);letter-spacing:.32em;line-height:1;margin-right:-.32em}
  .under{font-size:clamp(17px,1.5vw,21px);line-height:1.6;max-width:30ch}
  .under strong{font-weight:500;display:block;letter-spacing:.14em;text-transform:uppercase;font-size:.78em;margin-bottom:6px;opacity:.85}
  .kontakt{list-style:none;display:flex;flex-direction:column;gap:10px;font-size:15px;letter-spacing:.12em;text-transform:uppercase}
  .kontakt a{color:var(--krem);text-decoration:none;border-bottom:1px solid rgba(251,246,240,.35);padding-bottom:2px}
  .kontakt a:hover{border-color:var(--oker);color:#fff}
  .bilder{display:grid;grid-template-rows:1fr 1fr;gap:12px;padding:12px 12px 12px 0;height:100vh;position:sticky;top:0}
  .bilder img{min-height:0}
  .bilder img{width:100%;height:100%;object-fit:cover;display:block}
  .bilder img.kopp{object-position:60% 55%}
  .bilder img.skaler{object-position:40% 45%}
  @media (max-width:820px){
    .side{grid-template-columns:1fr}
    .tekst{padding:56px 24px 40px;gap:32px}
    .bilder{grid-template-rows:none;grid-template-columns:1fr 1fr;padding:0 12px 12px;height:70vw;position:static}
  }
</style>
</head>
<body>
<main class="side">
  <section class="tekst">
    <h1 class="logo">ENNI</h1>
    <p class="under"><strong>Nettsiden er under arbeid</strong>Håndlaget keramikk. Vi er snart på plass her – ta gjerne kontakt i mellomtiden.</p>
    <ul class="kontakt">
      <li><a href="mailto:post@enni.com">post@enni.com</a></li>
      <li><a href="tel:+4792666131">926 66 131</a></li>
      <li><a href="https://www.instagram.com/enni_ceramics/" target="_blank" rel="noopener">@enni_ceramics</a></li>
    </ul>
  </section>
  <section class="bilder" aria-label="Keramikk fra ENNI">
    <img class="skaler" src="skaler.jpg" alt="To spettede skåler i steingods">
    <img class="kopp" src="kopp.jpg" alt="Blå kopp og spettet skål">
  </section>
</main>
</body>
</html>
